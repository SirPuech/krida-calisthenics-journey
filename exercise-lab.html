<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KRIDA exercise lab</title>
<style>
  body { margin: 0; background: #0b1220; color: #f8fafc; font: 14px system-ui, sans-serif; }
  header { padding: 10px 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid #1e293b; }
  select, button { background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 6px; padding: 6px 10px; font: inherit; }
  #stage { width: 100vw; height: calc(100vh - 52px); }
  #grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
  .cell { height: 300px; position: relative; border: 1px solid #1e293b; }
  .cell span { position: absolute; top: 6px; left: 8px; font: 700 11px monospace; color: #f97316; z-index: 2; }
</style>
</head>
<body>
<header>
  <select id="pick"></select>
  <button id="grid-btn">Show all</button>
  <span id="status"></span>
</header>
<div id="stage"></div>
<script type="module">
import { mountAnimator } from './js/exercise/animator.js';
import { POSES } from './js/exercise/poses.js';

const names = Object.keys(POSES);
const pick = document.getElementById('pick');
const stage = document.getElementById('stage');
const status = document.getElementById('status');
for (const n of names) { const o = document.createElement('option'); o.value = o.textContent = n; pick.appendChild(o); }

let handle = null;
async function single(name) {
  stage.innerHTML = '';
  if (handle) handle.dispose();
  handle = await mountAnimator(stage, name);
  status.textContent = name + ' · ' + POSES[name].motion + ' · ' + POSES[name].apparatus;
}
pick.addEventListener('change', () => single(pick.value));

document.getElementById('grid-btn').addEventListener('click', async () => {
  if (handle) { handle.dispose(); handle = null; }
  stage.innerHTML = '<div id="grid"></div>';
  const grid = document.getElementById('grid');
  for (const n of names) {
    const cell = document.createElement('div');
    cell.className = 'cell';
    const label = document.createElement('span');
    label.textContent = n;
    cell.appendChild(label);
    grid.appendChild(cell);
    await mountAnimator(cell, n);
  }
  status.textContent = names.length + ' archetypes';
});

single(names[0]);
</script>
</body>
</html>
